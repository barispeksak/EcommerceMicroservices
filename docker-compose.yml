services:
  postgresql:
    image: postgres:15-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "trendyolDb"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "123456"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db 
    environment:
      - TZ=Europe/Istanbul

  addressservice:
    build:
      context: ./AddressMicroservice
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=postgresql;Port=5432;Database=trendyolDb;Username=postgres;Password=123456"
    depends_on:
      postgresql:
        condition: service_healthy
      authservice:
        condition: service_healthy

  authservice:
    build:
      context: ./AuthMicroservice
      dockerfile: Dockerfile
    ports:
      - "5100:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=postgresql;Port=5432;Database=trendyolDb;Username=postgres;Password=123456"
      Jwt__Key: 'C#fTjWnZr4u7x!A%D*G-KaPdSgVkYp3s'
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  apigatewayservice:
    build:
      context: ./ApiGatewayMicroservice
      dockerfile: Dockerfile
    ports:
      - "5050:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      authservice:
        condition: service_healthy
      addressservice:
        condition: service_started
      orderstatusmicroservice:
        condition: service_started
      paymenttypemicroservice:
        condition: service_started
      productcategorymicroservice:
        condition: service_started
      productconfigurationmicroservice:
        condition: service_started
      productitemmicroservice:
        condition: service_started
      productmicroservice:
        condition: service_started
      shippingtypemicroservice:
        condition: service_started
      shopordermicroservice:
        condition: service_started
      shoppingcartmicroservice:
        condition: service_started
      useraddressmicroservice:
        condition: service_started
      usermicroservice:
        condition: service_started
      variationmicroservice:
        condition: service_started
      variationoptionmicroservice:
        condition: service_started

  orderstatusmicroservice:
